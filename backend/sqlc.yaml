version: "2"
sql:
  - engine: "mysql"
    queries: "./queries/"
    schema: "./schema.sql"
    gen:
      go:
        package: "db"
        out: "./db"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        overrides:
          - column: "courts.avg_rating"
            go_type: "float64"
          - db_type: "decimal"
            go_type: "float64"
